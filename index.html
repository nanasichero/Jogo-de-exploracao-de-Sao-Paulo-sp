<!DOCTYPE html>
<html>
<body style="margin:0; background:#222; color:white; text-align:center;">
<canvas id="gameCanvas" width="400" height="600" style="background:#333; display:block; margin:20px auto;"></canvas>
<p>Toque para mover o avatar até a casa vermelha!</p>
<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let player = {x: 50, y: 50, color: "yellow"};
let goal = {x: 300, y: 500, color: "red"};

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Desenha o jogador
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, 30, 30);
    // Desenha a casa (objetivo)
    ctx.fillStyle = goal.color;
    ctx.fillRect(goal.x, goal.y, 50, 50);
    requestAnimationFrame(draw);
}

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    player.x = e.clientX - rect.left - 15;
    player.y = e.clientY - rect.top - 15;
});
draw();
</script>
</body>
</html>
